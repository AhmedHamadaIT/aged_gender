# BoT-SORT tuned for fixed / slow-pan RTSP: disables sparse optical-flow GMC that
# logs heavily when texture is poor ("not enough matching points").

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True

gmc_method: none

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
