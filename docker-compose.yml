# ============================================
# Docker Compose — YOLO Object Detection
# ============================================
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f yolo-detect   (Compose v2 plugin)
#         If `docker compose` errors on `-f`, use: docker-compose logs -f yolo-detect
# Shell:  docker compose exec yolo-detect bash
# Older Docker hosts may require: docker-compose ...
# ============================================

services:

  # ── Redis (live-stream pub/sub broker) ──────
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no   # memory-only, no disk persistence needed

  # ── Qdrant vector DB (ReID identity store) ──
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── ML Pipeline ────────────────────────────
  yolo-detect:
    container_name: yolo-detect
    build:
      context: .
      dockerfile: dockerfile
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "9000"]
    runtime: nvidia
    stdin_open: true
    tty: true

    depends_on:
      - qdrant
      - redis

    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Default for in-compose Redis (avoids localhost:6379 inside the container)
      - REDIS_URL=redis://redis:6379/0
      # Camera is now stable H.264 — run performance profile.
      - RTSP_PROFILE=performance
      - FORCE_TRANSCODE=false
      - RTSP_DISCARD_CORRUPT=false
      - RTSP_LOW_DELAY=true
      - RTSP_FFMPEG_OPTIONS=
      # Hardware decode (fallback to CPU automatically if unavailable)
      - RTSP_ENABLE_GPU_DECODE=true
      - RTSP_HWACCEL=cuda
      - RTSP_HWDECODER=h264_nvv4l2dec
      - QUALITY_LADDER=1920x1080x10,1280x720x10,854x480x8
      - STREAM_DOWNGRADE_AFTER=20
      - STREAM_DOWNGRADE_COOLDOWN=30
      - FRAME_MIN_VARIANCE=8.0
      - STREAM_MAX_FAILS=15
      - STREAM_RECONNECT_DELAY=2.0
      - EMBED_CONF_THRESHOLD=0.45
      - EMBED_BATCH_SIZE=8
      - EMBED_FLUSH_TIMEOUT=3.0
      - REDIS_LIVE_FPS=10

    volumes:
      - .:/app                  # mount entire project directory
      - ./models:/app/models    # model files
      - ./outputs:/app/outputs  # saved frames

    ports:
      - "9000:9000"    # YOLO Detection API

    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

    restart: "no"

volumes:
  qdrant_data: