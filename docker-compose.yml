# ============================================
# Docker Compose — YOLO Object Detection
# ============================================
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f
# Shell:  docker compose exec yolo-detect bash
# ============================================

services:

  # ── Redis (live-stream pub/sub broker) ──────
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no   # memory-only, no disk persistence needed

  # ── Qdrant vector DB (ReID identity store) ──
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── ML Pipeline ────────────────────────────
  yolo-detect:
    container_name: yolo-detect
    build:
      context: .
      dockerfile: dockerfile
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "9000"]
    runtime: nvidia
    stdin_open: true
    tty: true

    depends_on:
      - qdrant
      - redis

    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app

    volumes:
      - .:/app                  # mount entire project directory
      - ./models:/app/models    # model files
      - ./outputs:/app/outputs  # saved frames

    ports:
      - "9000:9000"    # YOLO Detection API

    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

    restart: "no"

volumes:
  qdrant_data: